<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aston Digital Prospectus</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: #0c0c0c; color: #efefef; font-family: system-ui, sans-serif; font-size: 15px; }
  a { color: #f072ff; }
</style>
<script>
  // Build the target from the current path so this works at a domain root
  // (Vercel) and under a project subpath (GitHub Pages), with or without a
  // trailing slash. A plain relative URL breaks on ".../Aston-Prospectus"
  // because it resolves against the parent directory.
  (function () {
    var base = location.pathname.replace(/index\.html$/, '').replace(/\/?$/, '/');
    location.replace(base + 'design/Aston%20Prospectus%20Preview.dc.html');
  })();
</script>
</head>
<body>
<p>Loading the prototype… <a id="fallback" href="design/Aston%20Prospectus%20Preview.dc.html">open it directly</a> if nothing happens.</p>
<script>
  var b = location.pathname.replace(/index\.html$/, '').replace(/\/?$/, '/');
  document.getElementById('fallback').href = b + 'design/Aston%20Prospectus%20Preview.dc.html';
</script>
</body>
</html>
